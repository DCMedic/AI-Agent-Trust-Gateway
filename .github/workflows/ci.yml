name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run security regression tests
        run: pytest -q
      - name: Run adversarial scenarios
        run: python tools/run_scenarios.py
      - name: Run scored red-team evaluation
        run: python tools/evaluate_redteam.py
      - name: Run live MCP adversarial lab
        run: python lab/run_live_lab.py
      - name: Run policy differential evaluation
        run: python tools/evaluate_policy_differential.py
